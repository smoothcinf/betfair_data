[build-system]
requires = ["maturin>=0.12,<=0.15"]
build-backend = "maturin"

[project]
name = "betfair-data-smoothcinf"
requires-python = ">=3.7"
version = "0.3.5"
description = "Fast Python Betfair historic data file parser with updated Betfair Stream API support"
readme = "README.md"

authors = [
    { name = "Robert Tarbath", email = "rtarbath@gmail.com" }
]

maintainers = [
    { name = "smoothcinf" }
]

license = { file = "LICENSE" }

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
homepage = "https://github.com/smoothcinf/betfair_data"
repository = "https://github.com/smoothcinf/betfair_data"