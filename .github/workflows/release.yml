name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel - ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Intel
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto

          # Linux ARM
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto

          # macOS Intel
          - os: macos-latest
            target: x86_64
            manylinux: off

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64
            manylinux: off

          # Windows 64-bit
          - os: windows-latest
            target: x64
            manylinux: off

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v0.15.3
          rust-toolchain: nightly-2022-03-15
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl


  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: v0.15.3
          rust-toolchain: nightly-2022-03-15
          args: --locked --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz


  test-wheel:
    name: Test Linux wheel
    runs-on: ubuntu-latest
    needs: build-wheels

    steps:
      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest-x86_64
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Test package
        shell: bash
        run: |
          python -c "import betfair_data; print('betfair_data import OK')"
          python -c "from betfair_data import bflw; print('bflw import OK')"
          python -c "import importlib.metadata as m; print('version:', m.version('betfair-data-smoothcinf'))"


  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    # Manual workflow runs BUILD/TEST only.
    # PyPI upload happens only when you publish a GitHub Release.
    if: github.event_name == 'release'

    needs:
      - build-wheels
      - test-wheel

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Show distributions
        run: ls -lah dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
